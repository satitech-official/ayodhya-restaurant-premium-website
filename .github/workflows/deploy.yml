name: Deploy Ayodhya Restaurant to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare public GitHub Pages build
        shell: bash
        run: |
          # GitHub Pages is static hosting. Exclude server-only admin/API routes
          # only inside the Actions workspace; the repository source stays intact.
          rm -rf src/app/api src/app/admin
          find src/app -type f \( -name '*.js' -o -name '*.jsx' -o -name '*.ts' -o -name '*.tsx' \) \
            -exec sed -i '/export const dynamic = "force-dynamic";/d' {} +

          # Next.js metadata routes need an explicit static mode during export.
          for file in src/app/manifest.js src/app/manifest.ts src/app/sitemap.js src/app/sitemap.ts; do
            if [ -f "$file" ]; then
              sed -i '/export const dynamic = /d' "$file"
              printf '\nexport const dynamic = "force-static";\n' >> "$file"
            fi
          done

      - name: Build production website
        env:
          GITHUB_PAGES: "true"
        run: npm run build

      - name: Fix direct public asset paths for repository subpath
        shell: bash
        run: |
          find out -type f \( -name '*.html' -o -name '*.js' -o -name '*.json' -o -name '*.css' \) -print0 \
            | xargs -0 -r sed -i 's#/images/#/ayodhya-restaurant-premium-website/images/#g'
          touch out/.nojekyll

      - name: Configure and enable GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
